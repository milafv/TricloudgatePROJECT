tosca_definitions_version: tosca_2_0
description: Complex blueprint with all three resource categories

node_templates:
  primary_server:
    type: tosca.nodes.Compute
    properties:
      num_cpus: 8
      mem_size: 16384 MB
      disk_size: 200 GB
      os_type: linux

  secondary_server:
    type: tosca.nodes.Compute
    properties:
      num_cpus: 2
      mem_size: 4096 MB
      disk_size: 50 GB
      os_type: linux

  data_storage:
    type: tosca.nodes.Storage.ObjectStorage
    properties:
      size: 1000 GB
      name: data-bucket

  main_network:
    type: tosca.nodes.network.Network
    properties:
      cidr: 10.0.0.0/16
      network_name: main-vpc

relationship_templates:
  primary_to_storage:
    type: tosca.relationships.ConnectsTo
    source: primary_server
    target: data_storage

  primary_to_network:
    type: tosca.relationships.HostedOn
    source: primary_server
    target: main_network
